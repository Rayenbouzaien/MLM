server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Probe endpoint for Docker / Kubernetes (does not depend on the API).
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Reverse proxy to the API. "api" is the service name on BOTH the Docker
  # Compose network and the Kubernetes namespace (cluster DNS), so this file
  # is identical in both environments.
  location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # /api/live is a Server-Sent Events stream: never buffer it, and keep
    # the connection open for a long time.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  # Hashed build assets: cache aggressively.
  location /assets/ {
    expires 7d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Single-page app: any other path serves the app shell (e.g. /admin).
  location / {
    try_files $uri /index.html;
  }
}
