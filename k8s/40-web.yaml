apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: gridlock
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web, app.kubernetes.io/part-of: gridlock }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101       # "nginx" user of nginx-unprivileged
      containers:
        - name: web
          image: gridlock-web:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 200m, memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: gridlock
spec:
  selector: { app: web }
  ports:
    - name: http
      port: 80
      targetPort: http
