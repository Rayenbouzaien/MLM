# Read-only access for the API's admin "Pods" dashboard (/api/admin/pods).
# Scoped to THIS namespace only; no write verbs, no secrets, no exec/logs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-observer
  namespace: gridlock
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: api-observer
  namespace: gridlock
rules:
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]     # needs metrics-server (same as the HPA)
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: api-observer
  namespace: gridlock
subjects:
  - kind: ServiceAccount
    name: api-observer
    namespace: gridlock
roleRef:
  kind: Role
  name: api-observer
  apiGroup: rbac.authorization.k8s.io
