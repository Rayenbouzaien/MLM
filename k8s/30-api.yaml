apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: gridlock
spec:
  replicas: 2                # scaled up/down with `kubectl scale` or by the HPA
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api, app.kubernetes.io/part-of: gridlock }
    spec:
      serviceAccountName: api-observer   # read-only pod view for /api/admin/pods (see 80-rbac.yaml)
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: api
          image: gridlock-api:1.0.0
          imagePullPolicy: IfNotPresent   # image is built straight into Minikube's Docker
          ports:
            - name: http
              containerPort: 4000
          envFrom:
            - configMapRef: { name: gridlock-config }
            - secretRef: { name: gridlock-secrets }
          startupProbe:                    # first boot/migration can be slow on small Minikube nodes
            httpGet: { path: /api/health, port: http }
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 12           # allow up to 120 s before restart
          readinessProbe:                  # in the Service only while the DB answers
            httpGet: { path: /api/ready, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec: { command: ["sh", "-c", "sleep 5"] }   # let endpoints drain before SIGTERM
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:                       # requests are required for CPU-based HPA
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: api                  # same DNS name as in docker-compose -> nginx.conf unchanged
  namespace: gridlock
spec:
  selector: { app: api }
  ports:
    - name: http
      port: 4000
      targetPort: http
