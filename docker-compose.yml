# Gridlock — 4-tier stack for local orchestration
#
#   browser ──> web (nginx :8080) ──/api──> api (Express :4000, scalable) ──> db (Postgres)
#                                                      └───────────────────> redis (live-feed pub/sub)
#
# Usage:
#   cp .env.example .env
#   docker compose up -d --build
#   docker compose up -d --scale api=3        # horizontal scaling of the API
#   open http://localhost:8080
name: gridlock

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gridlock
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
    volumes:
      - pg_data:/var/lib/postgresql/data      # persistent: survives `docker compose down`
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gridlock"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF persistence so the "recent events" list survives a restart.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./server
    image: gridlock-api:1.0.0
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-devpassword}@db:5432/gridlock
      PGSSL: "false"
      PGPOOL_MAX: ${PGPOOL_MAX:-10}
      REDIS_URL: redis://redis:6379
      ALLOWED_ORIGINS: http://localhost:${WEB_PORT:-8080}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-32chars}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-dev-admin-pass}
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: lax
      PORT: "4000"
    # No host port and no container_name on purpose: several replicas can
    # coexist (--scale api=N); only nginx reaches them, by service name.
    expose: ["4000"]
    networks: [frontend, backend]

  web:
    build: ./frontend
    image: gridlock-web:1.0.0
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:8080"
    networks: [frontend]

  # Optional DB browser:  docker compose --profile tools up -d adminer
  # Bound to localhost only (Adminer has no login beyond the DB password).
  adminer:
    image: adminer:4
    profiles: [tools]
    restart: unless-stopped
    depends_on: [db]
    ports:
      - "127.0.0.1:8081:8080"
    networks: [backend]

networks:
  frontend:   # web <-> api
  backend:    # api <-> db / redis  (web has no route to the data tier)

volumes:
  pg_data:
  redis_data:
